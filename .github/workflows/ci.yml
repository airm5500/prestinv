name: CI Prestige Inventaire

# Analyse + tests + APK de test à chaque envoi (toutes branches) et sur les demandes de fusion.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Version alignée sur le projet (pubspec.lock : Dart >= 3.8, Flutter >= 3.27)
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      # Les remarques (« info ») existantes ne bloquent pas ; toute erreur ou tout avertissement bloque.
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos

      # Socle de tests (voir test/README.md), par catégorie pour des journaux lisibles. Aucun émulateur :
      # l'application entière tourne dans `flutter test`, contre un faux serveur Prestige.
      # Garde-fou : tout fichier *_test.dart de test/ doit appartenir à une catégorie lancée ci-dessous.
      - name: Contrôle des catégories de tests
        shell: bash
        run: |
          hors=$(find test -name '*_test.dart' | grep -vE '^test/[^/]+_test\.dart$|^test/(unitaires|non_regression|integration|e2e|ergonomie)/' || true)
          if [ -n "$hors" ]; then echo "::error title=Tests hors catégorie::$hors"; exit 1; fi

      - name: Tests unitaires, widgets et non-régression
        shell: bash
        run: flutter test $(find test -maxdepth 1 -name '*_test.dart' | sort) test/unitaires test/non_regression

      - name: Tests d'intégration (services contre le faux serveur HTTP local)
        run: flutter test test/integration

      - name: Tests de bout en bout (application entière, deux interfaces, pannes)
        run: flutter test test/e2e

      - name: Tests d'ergonomie et de cohérence d'affichage
        run: flutter test test/ergonomie

      # Le test sur appareil (integration_test/, vrai serveur) n'est pas lancé ici : ses parcours sont
      # joués contre le faux serveur par test/e2e/integration_test_coherence_test.dart.

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build_apk.log

      # La version de l'APK construit doit être celle de pubspec.yaml (docs/VERSIONS_SUNMI.md : source unique).
      - name: Version de l'APK (= pubspec.yaml)
        shell: bash
        run: |
          meta=$(find build/app/outputs -name output-metadata.json | head -1)
          cat "$meta"
          attendu=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')
          apk=$(python3 -c "import json,sys; e=json.load(open(sys.argv[1]))['elements'][0]; print(f\"{e['versionName']}+{e['versionCode']}\")" "$meta")
          echo "pubspec.yaml : $attendu · APK : $apk"
          if [ "$attendu" != "$apk" ]; then echo "::error title=Version de l'APK::APK $apk ≠ pubspec.yaml $attendu"; exit 1; fi
          echo "::notice title=Version de l'APK::$apk"

      # En cas d'échec : l'erreur Gradle est remontée en annotation (lisible sans télécharger le journal).
      - name: Résumé de l'erreur de build
        if: failure()
        shell: bash
        run: |
          [ -f build_apk.log ] || exit 0
          resume=$(grep -iE -A12 "What went wrong|error:|FAILURE|Exception" build_apk.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build APK::${resume}"

      - uses: actions/upload-artifact@v4
        with:
          name: prestinv-apk
          # Le Gradle du projet renomme l'APK (prestigeinv-<variante>-<version>.apk) : on prend tous les APK produits.
          path: build/app/outputs/**/*.apk
          retention-days: 30
