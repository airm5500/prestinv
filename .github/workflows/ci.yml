name: CI Prestige Inventaire

# Analyse + tests + APK de test à chaque envoi (toutes branches) et sur les demandes de fusion.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Version alignée sur le projet (pubspec.lock : Dart >= 3.8, Flutter >= 3.27)
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      # Les remarques (« info ») existantes ne bloquent pas ; toute erreur ou tout avertissement bloque.
      - name: Analyse statique
        id: analyse
        run: flutter analyze --no-fatal-infos

      # Socle de tests (voir test/README.md), par catégorie pour des journaux lisibles. Aucun émulateur :
      # l'application entière tourne dans `flutter test`, contre un faux serveur Prestige.
      # Garde-fou : tout fichier *_test.dart de test/ doit appartenir à une catégorie lancée ci-dessous.
      - name: Contrôle des catégories de tests
        id: categories
        shell: bash
        run: |
          hors=$(find test -name '*_test.dart' | grep -vE '^test/[^/]+_test\.dart$|^test/(unitaires|non_regression|integration|e2e|ergonomie|performance|reseau)/' || true)
          if [ -n "$hors" ]; then echo "::error title=Tests hors catégorie::$hors"; exit 1; fi
          mkdir -p build/rapport_tests

      # Toutes les catégories sont jouées même si l'une échoue (rapport complet) ; le job échoue alors,
      # et l'APK n'est pas construit. Chaque catégorie écrit aussi ses résultats (JSON) pour le rapport.
      - name: Tests unitaires, widgets et non-régression
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        shell: bash
        run: flutter test --file-reporter json:build/rapport_tests/1-unitaires.json $(find test -maxdepth 1 -name '*_test.dart' | sort) test/unitaires test/non_regression

      - name: Tests d'intégration (services contre le faux serveur HTTP local)
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        run: flutter test --file-reporter json:build/rapport_tests/2-integration.json test/integration

      - name: Tests de bout en bout (application entière, deux interfaces, pannes)
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        run: flutter test --file-reporter json:build/rapport_tests/3-e2e.json test/e2e

      - name: Tests d'ergonomie et de cohérence d'affichage
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        run: flutter test --file-reporter json:build/rapport_tests/4-ergonomie.json test/ergonomie

      # Un fichier à la fois (-j 1) : les temps mesurés ne sont pas faussés par les autres tests.
      - name: Tests de performance (temps, images, nombre de requêtes — seuils)
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        run: flutter test -j 1 --file-reporter json:build/rapport_tests/5-performance.json test/performance

      - name: Tests réseau (serveur lent, réponses tronquées, coupures, local/distant, HTTPS)
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        run: flutter test --file-reporter json:build/rapport_tests/6-reseau.json test/reseau

      # Rapport de tests de livraison : résumé par catégorie + mesures de performance, dans le résumé du
      # job et en artefact « rapport-tests » (à côté de l'APK).
      - name: Rapport de tests de livraison
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        shell: bash
        run: dart run tool/rapport_tests.dart build/rapport_tests >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.categories.outcome == 'success' }}
        with:
          name: rapport-tests
          path: |
            build/rapport_tests/rapport.md
            build/rapport_tests/resume.json
            build/rapport_tests/*.json
          retention-days: 30

      # Le test sur appareil (integration_test/, vrai serveur) n'est pas lancé ici : ses parcours sont
      # joués contre le faux serveur par test/e2e/integration_test_coherence_test.dart.

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build_apk.log

      # La version de l'APK construit doit être celle de pubspec.yaml (docs/VERSIONS_SUNMI.md : source unique).
      - name: Version de l'APK (= pubspec.yaml)
        shell: bash
        run: |
          meta=$(find build/app/outputs -name output-metadata.json | head -1)
          cat "$meta"
          attendu=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')
          apk=$(python3 -c "import json,sys; e=json.load(open(sys.argv[1]))['elements'][0]; print(f\"{e['versionName']}+{e['versionCode']}\")" "$meta")
          echo "pubspec.yaml : $attendu · APK : $apk"
          if [ "$attendu" != "$apk" ]; then echo "::error title=Version de l'APK::APK $apk ≠ pubspec.yaml $attendu"; exit 1; fi
          echo "::notice title=Version de l'APK::$apk"

      # 4.16.0 : l'APK (terminaux Sunmi, PC du pharmacien) garde l'API cible de Flutter ; seul le build Google Play
      # passe à 36 (-P prestinvTargetSdk=36, play.yml).
      - name: API cible de l'APK (inchangée, pas 36)
        shell: bash
        run: |
          manifeste=$(find build/app/intermediates -path '*merged_manifest*' -path '*elease*' -name AndroidManifest.xml | head -1)
          cible=$(grep -o 'android:targetSdkVersion="[0-9]*"' "$manifeste" | head -1)
          echo "APK : $cible ($manifeste)"
          if [ -z "$cible" ] || printf '%s' "$cible" | grep -q '"36"'; then echo "::error title=API cible de l'APK::$cible (attendu : valeur de Flutter, 35)"; exit 1; fi
          echo "::notice title=API cible de l'APK::$cible"

      # 4.16.0 : le build Google Play (targetSdk / compileSdk 36) est construit ici aussi, SANS clé (signé debug, jamais
      # publié) : une incompatibilité d'Android 16 (greffon, Gradle) est vue à chaque envoi, même sans les secrets.
      - name: Contrôle du build Google Play (App Bundle targetSdk 36, sans clé)
        shell: bash
        run: |
          set -o pipefail
          flutter build appbundle --release --android-project-arg=prestinvTargetSdk=36 2>&1 | tee build_aab.log
          manifeste=$(find build/app/intermediates -path '*merged_manifest*' -path '*elease*' -name AndroidManifest.xml | head -1)
          grep -q 'android:targetSdkVersion="36"' "$manifeste" || { echo "::error title=Build Google Play::targetSdk 36 non appliqué"; exit 1; }
          [ -s build/app/outputs/bundle/release/app-release.aab ] || { echo "::error title=Build Google Play::App Bundle absent"; exit 1; }
          echo "::notice title=Build Google Play::App Bundle targetSdk 36 construit (signé debug, contrôle seulement)"

      # En cas d'échec : l'erreur Gradle est remontée en annotation (lisible sans télécharger le journal).
      - name: Résumé de l'erreur de build
        if: failure()
        shell: bash
        run: |
          for journal in build_apk.log build_aab.log; do
            [ -f "$journal" ] || continue
            resume=$(grep -iE -A12 "What went wrong|error:|FAILURE|Exception" "$journal" | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$resume" ] && echo "::error title=Build ($journal)::${resume}"
          done
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: prestinv-apk
          # Le Gradle du projet renomme l'APK (prestigeinv-<variante>-<version>.apk) : on prend tous les APK produits.
          path: build/app/outputs/**/*.apk
          retention-days: 30
